name: publish

# Repackage newly published stack releases and republish the signed apt repo.
# The poll is the release trigger: no tool repository needs a change or a hand PR.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check out the published tree
        run: |
          git fetch origin gh-pages
          git worktree add site origin/gh-pages
      - name: Build packages for new releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # One tool's refused or unreadable release must not block the others:
          # record it, publish what verified, and fail the run at the end.
          # Each command's output and exit status are kept for the final gate, which
          # tells the one expected state (seeds promotion pending) from a real failure.
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          echo "GATE_DIR=$gate" >> "$GITHUB_ENV"
          status=0
          for channel in canary stable nightly; do
            rc=0
            python3 scripts/build_debs.py --manifest tools.json --pool site/pool --channel "$channel" --latest 3 \
              > "$gate/build-$channel.log" 2>&1 || rc=$?
            cat "$gate/build-$channel.log"
            echo "$rc" > "$gate/build-$channel.rc"
            [ "$rc" = 0 ] || status=1
          done
          echo "BUILD_STATUS=$status" >> "$GITHUB_ENV"
      - name: Bound the served pool
        # GitHub Pages refuses a site over 1 GB (aegis-g68w.19). Keep the newest
        # versions plus declared rollback targets; removed bytes stay in history.
        run: python3 scripts/prune_pool.py --root site --retention retention.json
      - name: Index and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          FINGERPRINT_FILE: FINGERPRINT
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          fpr="$(cat "$FINGERPRINT_FILE")"
          # Refuse to sign with anything but the published repository key.
          gpg --batch --with-colons --list-secret-keys | grep -qx "fpr:::::::::$fpr:"
          status="$BUILD_STATUS"
          for channel in canary stable nightly; do
            rel="site/dists/$channel/Release"
            before="$(sha256sum "$rel" 2>/dev/null || true)"
            # The index independently excludes existing, unapproved seeds bytes.
            # It still writes a safe index for other tools; report refusal below.
            index_status=0
            python3 scripts/index_repo.py --root site --channel "$channel" \
              > "$GATE_DIR/index-$channel.log" 2>&1 || index_status=$?
            cat "$GATE_DIR/index-$channel.log"
            echo "$index_status" > "$GATE_DIR/index-$channel.rc"
            case "$index_status" in
              0) ;;
              3) status=1 ;;  # safe index written; one or more seeds packages excluded
              *) exit "$index_status" ;;  # no signing/publishing after an unknown index failure
            esac
            signer="$(gpg --batch --status-fd 1 --verify "site/dists/$channel/InRelease" 2>/dev/null | awk '/VALIDSIG/{print $3; exit}' || true)"
            if [ "$before" = "$(sha256sum "$rel")" ] && [ "$signer" = "$fpr" ]; then
              continue  # unchanged index already signed by the current key
            fi
            gpg --batch --yes --local-user "$fpr" --clearsign -o "site/dists/$channel/InRelease" "$rel"
            gpg --batch --yes --local-user "$fpr" -abs -o "site/dists/$channel/Release.gpg" "$rel"
          done
          echo "BUILD_STATUS=$status" >> "$GITHUB_ENV"
          cp key.gpg key.asc site/
          touch site/.nojekyll
      - name: Publish
        run: |
          # Refuse to push a tree Pages cannot deploy: a failed deploy leaves the
          # old index served silently, which is worse than a red publish run.
          bytes="$(find site -path site/.git -prune -o -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')"
          echo "site tree: $bytes bytes"
          if [ "$bytes" -gt 950000000 ]; then echo "REFUSED: site tree $bytes bytes exceeds the 950 MB Pages budget"; exit 1; fi
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "no new packages"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "publish $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:gh-pages
      - name: Fail on any refused or unknown release
        if: env.BUILD_STATUS != '0'
        # Only the exact pending-seeds state is a warning (scripts/publish_gate.py);
        # any other refusal, UNKNOWN or unreadable result still fails the run.
        run: python3 scripts/publish_gate.py --gate-dir "$GATE_DIR" --policy canary/policy.json --receipts canary/receipts
